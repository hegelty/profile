			/* Portal page specific styles */
			body {

			#portal-wrapper {

				align-items: center;
				justify-content: center;

				padding: 2em;
				background: #1a1a1a;
			}

			.portal-content {
				text-align: center;
				max-width: 800px;
				width: 100%;
			}

			.portal-content h1 {
				font-size: 3em;
				margin-bottom: 0.5em;
				color: #ffffff;
			}

			.portal-content h2 {
				font-size: 1.5em;
				margin-bottom: 0.3em;

			}

			.portal-content .subtitle {
				font-size: 1.2em;
				margin-bottom: 2em;
				color: rgba(255, 255, 255, 0.6);
			}

			.contact-info {
				margin: 2em 0;
				padding: 1.5em;
				background: rgba(255, 255, 255, 0.05);
				border-radius: 8px;
			}

			.contact-info p {
				margin: 0.5em 0;
				color: rgba(255, 255, 255, 0.7);
			}

			.contact-info a {
				color: #ffffff;
				text-decoration: none;
				border-bottom: 1px dotted rgba(255, 255, 255, 0.5);
			}

			.contact-info a:hover {
				color: rgba(255, 255, 255, 0.8);
				border-bottom-color: rgba(255, 255, 255, 0.8);
			}

			.portal-links {
				display: grid;
				grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
				gap: 1.5em;
				margin-top: 3em;
			}

			.portal-link {
				display: block;
				padding: 2em 1.5em;
				background: rgba(255, 255, 255, 0.05);
				border: 2px solid rgba(255, 255, 255, 0.1);
				border-radius: 12px;
				text-decoration: none;
				transition: all 0.3s ease;
				position: relative;
				overflow: hidden;
			}

			.portal-link:before {
				content: '';
				position: absolute;
				top: 0;
				left: 0;
				right: 0;
				bottom: 0;
				background: rgba(255, 255, 255, 0.1);
				opacity: 0;
				transition: opacity 0.3s ease;
			}

			.portal-link:hover {
				transform: translateY(-5px);
				border-color: rgba(255, 255, 255, 0.3);
				box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
			}

			.portal-link:hover:before {
				opacity: 1;
			}

			.portal-link-content {
				position: relative;
				z-index: 1;
			}

			.portal-link i {
				font-size: 3em;
				margin-bottom: 0.5em;
				display: block;
				color: #ffffff;
			}

			.portal-link h3 {
				font-size: 1.5em;
				margin-bottom: 0.5em;
				color: rgba(255, 255, 255, 0.9);
			}

			.portal-link p {
				font-size: 0.9em;
				color: rgba(255, 255, 255, 0.6);
				margin: 0;
			}

			.social-links {
				margin-top: 2em;
				display: flex;
				justify-content: center;
				gap: 1.5em;
			}

			.social-links a {
				color: rgba(255, 255, 255, 0.5);
				transition: color 0.3s ease;
			}

			.social-links a:hover {
				color: #ffffff;
			}

			@media screen and (max-width: 736px) {
				.portal-content h1 {

				}

				.portal-content h2 {
					font-size: 1.2em;
				}

				.portal-links {
